# File: ai-chat-frontend/nginx.dev.conf

server {
    listen 80;
    server_name localhost;

    # --- Proxy to Vite Dev Server ---
    # All non-API requests will be sent to the Vite server.
    location / {
        # 'frontend-dev' is the service name of the Vite container.
        # 5173 is the port Vite runs on inside its container.
        proxy_pass http://frontend-dev:5173;
        
        # These headers are crucial for WebSocket connection (used by HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # --- API Proxy to PHP-FPM ---
    # This block remains the same as our production-like setup.
    location /api/ {
        root /var/www/public;
        rewrite /api/(.*)$ /index.php/$1 last;
    }
    
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass ai_php_api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}