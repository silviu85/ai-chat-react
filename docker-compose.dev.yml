# File: ai-chat-frontend/docker-compose.dev.yml

services:
  # This is the Vite Dev Server. It's not exposed to the host.
  frontend-dev:
    container_name: ai_frontend_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host
    volumes:
      # Sync all source code for hot-reloading
      - .:/app
      # Isolate node_modules inside the container
      - /app/node_modules
    networks:
      - ai-network

  # This is the Nginx server, our single entry point.
  nginx-dev:
    image: nginx:stable-alpine
    container_name: ai_nginx_dev # Use a different name to avoid conflicts
    ports:
      - "8080:80"
    volumes:
      # Mount a specific nginx config for development
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
      # Mount Laravel's public folder
      - ../ai-php-api/public:/var/www/public
    networks:
      - ai-network
    depends_on:
      - frontend-dev # Nginx should start after the Vite server

networks:
  ai-network:
    name: ai-shared-network
    external: true